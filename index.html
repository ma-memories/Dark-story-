<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما الذاكرة القديمة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0b;
            color: #f0f0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #141414;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        /* ستايل النص والملف القديم */
        .old-file-box {
            background: #f4ecd8;
            color: #2b2b2b;
            padding: 25px;
            border: 1px dashed #8c7b5d;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 30px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        /* عداد الأفلام القديم */
        #film-counter {
            text-align: center;
            font-size: 6rem;
            color: #ff3b30;
            margin: 50px 0;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255,59,48,0.7);
            display: none;
        }
        /* لوحة الأدلة (الـ 4 صور في الآخر) */
        .evidence-board {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
            padding: 15px;
            background: #1f1f1f;
            border: 2px solid #444;
        }
        .evidence-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        /* ستايل سبوتيفاي للأغنية والكلمات */
        .spotify-container {
            display: none;
            background: #121212;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            border: 1px solid #282828;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .spotify-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid #282828;
            padding-bottom: 15px;
        }
        .spotify-cover {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            object-fit: cover;
        }
        .spotify-info h3 {
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 5px;
        }
        .spotify-info p {
            color: #b3b3b3;
            font-size: 1rem;
        }
        .spotify-lyrics {
            max-height: 200px;
            overflow-y: auto;
            text-align: center;
            font-size: 1.1rem;
            color: #b3b3b3;
            line-height: 2.2;
            padding: 10px;
        }
        .spotify-lyrics .highlight {
            color: #1db954;
            font-weight: bold;
            transform: scale(1.05);
            transition: all 0.3s ease;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- النص والملف القديم -->
        <div class="old-file-box">
            <p>سجلات القضية القديمة: تم توثيق كافة الأحداث والملفات السرية بدقة تامة. يرجى مراجعة التفاصيل أدناه بحذر شديد قبل الانتقال إلى مرحلة العرض النهائي...</p>
        </div>

        <!-- عداد الأفلام القديم -->
        <div id="film-counter">5</div>

        <!-- لوحة الأدلة (الـ 4 صور في النهاية) -->
        <div class="evidence-board" id="evidenceBoard">
            <img src="evidence1.jpg" alt="دليل 1" class="evidence-img">
            <img src="evidence2.jpg" alt="دليل 2" class="evidence-img">
            <img src="evidence3.jpg" alt="دليل 3" class="evidence-img">
            <img src="evidence4.jpg" alt="دليل 4" class="evidence-img">
        </div>

        <!-- مشغل موسيقى وكلمات بأسلوب سبوتيفاي -->
        <div class="spotify-container" id="spotifyContainer">
            <div class="spotify-header">
                <img src="song-cover.jpg" alt="صورة الأغنية" class="spotify-cover">
                <div class="spotify-info">
                    <h3 id="songTitle">اسم الأغنية هنا</h3>
                    <p id="bandName">اسم الفرقة هنا</p>
                </div>
            </div>
            <audio id="audioPlayer" controls src="song.mp3"></audio>
            <div class="spotify-lyrics" id="lyricsBox">
                <p>السطر الأول من الكلمات...</p>
                <p>السطر الثاني من الكلمات...</p>
                <p>السطر الثالث من الكلمات...</p>
            </div>
        </div>
    </div>

    <script>
        // تسلسل التشغيل التلقائي بالترتيب المطلوب
        window.addEventListener('DOMContentLoaded', () => {
            const evidenceBoard = document.getElementById('evidenceBoard');
            const filmCounter = document.getElementById('film-counter');
            const spotifyContainer = document.getElementById('spotifyContainer');
            
            // 1. إظهار لوحة الأدلة في مكانها الصحيح في النهاية والـ 4 صور ظاهرة
            evidenceBoard.style.display = 'grid';

            // 2. بعد انتهاء لوحة الأدلة، يظهر عداد الأفلام القديم من 5 إلى 0
            setTimeout(() => {
                evidenceBoard.style.display = 'none';
                filmCounter.style.display = 'block';
                
                let count = 5;
                const interval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        filmCounter.textContent = count;
                    } else if (count === 0) {
                        filmCounter.textContent = '0';
                    } else {
                        clearInterval(interval);
                        filmCounter.style.display = 'none';
                        // 3. بعد العداد، تظهر الأغنية والفرقة والصورة والكلمات بأسلوب سبوتيفاي والصوت
                        spotifyContainer.style.display = 'block';
                        document.getElementById('audioPlayer').play().catch(e => console.log("Autoplay blocked"));
                    }
                }, 1000);
            }, 4000);
        });
    </script>
</body>
</html>
